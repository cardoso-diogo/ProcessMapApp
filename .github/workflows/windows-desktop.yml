name: Publish portable Windows app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and publish portable executable
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: Process Map Builder ${{ github.ref_name }}
          releaseBody: |
            Portable Windows x64 edition of Process Map Builder.

            No installation is required. Download the executable and run it directly.
            This build is currently unsigned, so Windows SmartScreen may display a warning.
          releaseDraft: false
          prerelease: false
          args: --no-bundle
          uploadPlainBinary: true
          releaseAssetNamePattern: Process-Map-Builder_[version]_windows-x64[ext]

      - name: Publish SHA-256 checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ steps.tauri.outputs.appVersion }}
        run: |
          $assetName = "Process-Map-Builder_$env:APP_VERSION`_windows-x64.exe"
          $hash = (Get-FileHash -Algorithm SHA256 "src-tauri/target/release/process-map-builder.exe").Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content -Encoding ascii SHA256SUMS.txt
          gh release upload "$env:RELEASE_TAG" SHA256SUMS.txt --clobber
